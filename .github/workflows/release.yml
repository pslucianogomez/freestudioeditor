name: Release (Windows)

# Se dispara al subir un tag tipo v0.1.0. Compila el instalador y lo deja
# como borrador en GitHub Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run fetch-binaries
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FreeEditorStudio ${{ github.ref_name }}"
          releaseBody: |
            ## Descargar

            Bajá **`FreeEditorStudio_*_x64-setup.exe`** (más abajo, en *Assets*) y abrilo. Se instala solo para tu usuario, sin pedir permisos de administrador.

            > **Aviso de Windows:** el instalador todavía no está firmado digitalmente, así que Windows puede mostrar *"Windows protegió su PC"*. Tocá **Más información → Ejecutar de todas formas**. El código fuente completo está en este repositorio.

            Requisitos: Windows 10 u 11 de 64 bits.

            ## Novedades

            Ver [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          releaseDraft: true
